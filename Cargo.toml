[package]
name = "imgsmith"
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
description = "Convert, resize, crop and thumbnail images with one file and no other software"
license = "Apache-2.0"
repository = "https://github.com/marceanlabs/imgsmith"
readme = "README.md"
keywords = ["image", "convert", "resize", "thumbnail", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[features]
default = ["avif"]
# The AVIF encoder pulls 40 crates and 571k lines, half the dependency tree.
# On by default for the binary; library users who do not write AVIF can drop it.
avif = ["image/avif"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = [
    "rayon",
    "png",
    "jpeg",
    "webp",
    "tiff",
    "gif",
    "bmp",
    "ico",
    "tga",
    "pnm",
    "qoi",
    "hdr",
    "exr",
    "ff",
] }
kamadak-exif = "0.6.1"
rayon = "1.12.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
wildcard_imports = "warn"
must_use_candidate = "warn"
return_self_not_must_use = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
missing_panics_doc = "warn"
clone_on_ref_ptr = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
