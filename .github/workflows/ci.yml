name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --all
      - run: cargo test --all --no-default-features
      - run: cargo build --release

      # The promise: the same input and flags produce the same bytes. Hashes are
      # checked on every operating system, because "it is deterministic here" is
      # not the claim.
      - name: Output bytes are unchanged
        if: runner.os != 'Windows'
        run: bash scripts/golden.sh
      - name: Output bytes are unchanged (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/golden.sh
