name: fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz
        default: "900"

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly

      # Installed with the stable cargo: cargo-fuzz compiles fine there and is
      # invoked below through the nightly toolchain, which it needs to fuzz.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Seeds are committed, so the fuzzer starts inside the parsers instead of
      # rediscovering magic bytes for an hour, and CI needs no image tooling.
      - name: Seed corpus
        run: |
          mkdir -p fuzz/corpus/decode
          cp fuzz/seeds/* fuzz/corpus/decode/
          ls -1 fuzz/corpus/decode | wc -l

      # cargo-fuzz builds with panic=abort, so a panic inside the parser arrives
      # as a crash even though the shipped binary catches it and names the file.
      # The artifact below is the useful output; a red build every night is not.
      - name: Fuzz
        continue-on-error: true
        run: cargo +nightly fuzz run decode -- -max_total_time=${{ github.event.inputs.seconds || '900' }} -rss_limit_mb=4096

      - name: Keep the crash
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: |
            fuzz/artifacts/
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore
